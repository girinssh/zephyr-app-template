# prj.conf

# GPIO 드라이버 활성화
CONFIG_GPIO=y

# 1. Bluetooth Stack
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Zephyr_L2CAP_Rx_R"
CONFIG_BT_MAX_CONN=1

# 2. L2CAP CoC Support (CRITICAL)
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_SMP=y
CONFIG_BT_LL_SW_SPLIT=y

CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_RX_BUFFERS=18
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=40
CONFIG_BT_BUF_EVT_RX_COUNT=40

CONFIG_BT_L2CAP_TX_MTU=253
CONFIG_BT_L2CAP_TX_BUF_COUNT=24
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_BUF_ACL_TX_COUNT=32

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# 4. Memory Pool (L2CAP 수신용)
CONFIG_NET_BUF=y

# 5. Logging
CONFIG_LOG=n
# CONFIG_UART_CONSOLE=y


CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=7
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400


# 3. USB & Serial (UART)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y


CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y