# prj.conf

# 1. Bluetooth Stack
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Zephyr_L2CAP_Rx_L"
CONFIG_BT_MAX_CONN=1

# 2. L2CAP CoC Support (CRITICAL)
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_SMP=y
# 3. Buffer & MTU Configuration
# L2CAP 헤더와 데이터를 충분히 담을 수 있도록 설정
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=253
CONFIG_BT_L2CAP_TX_BUF_COUNT=20

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# 4. Memory Pool (L2CAP 수신용)
CONFIG_NET_BUF=y

# 5. Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# GPIO 드라이버 활성화
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=10
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=90
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
