# prj.conf

# 1. Bluetooth Stack
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_SCAN_BUF_SIZE=1650
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

CONFIG_BT_DEVICE_NAME="Zephyr_L2CAP_Tx_L"
CONFIG_BT_MAX_CONN=1

# 2. L2CAP CoC Support (CRITICAL)
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_SMP=y

CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# L2CAP 헤더와 데이터를 충분히 담을 수 있도록 설정
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_BUF_ACL_TX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=251

CONFIG_BT_L2CAP_TX_MTU=253
CONFIG_BT_L2CAP_TX_BUF_COUNT=24

CONFIG_BT_BUF_EVT_RX_COUNT=40
CONFIG_BT_CTLR_TX_DEFER=y
CONFIG_BT_LL_SW_SPLIT=y
# CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=1650

# 4. Memory Pool (L2CAP 수신용)
CONFIG_NET_BUF=y
# Heap for L2CAP TX buffers (중요: 고속 전송 시 버퍼 부족 방지)
CONFIG_HEAP_MEM_POOL_SIZE=4096

# 5. Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
# CONFIG_CBPRINTF_FP_SUPPORT=y

# GPIO 드라이버 활성화
CONFIG_GPIO=y


CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=16
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400